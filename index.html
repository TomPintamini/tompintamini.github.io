<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tom Pintamini - Miniature Painting & Scalemodelling</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css"/>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #d4af37;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0 40px 0;
        }

        header img {
            max-width: 280px;
            height: auto;
            border-radius: 8px;
        }

        h1 {
            font-size: 1.4rem;
            margin-top: 15px;
            color: #ffffff;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .gallery-section {
            max-width: 1200px;
            margin: 0 auto 50px auto;
        }

        .section-title {
            font-size: 1.4rem;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px;
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .grid-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            background-color: var(--card-bg);
            aspect-ratio: 1 / 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s ease;
            cursor: pointer;
        }

        .grid-item:hover {
            transform: scale(1.03);
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.jpg" alt="Tom Pintamini Logo">
        <h1>Miniature Painting & Scalemodelling</h1>
    </header>

    <main class="gallery-section">

        <!-- Galerie 1: Frostpunk Tower -->
        <h2 class="section-title">Frostpunk Tower</h2>
        <div class="grid" id="gallery-frostpunk"></div>

        <!-- Galerie 2: Katsuki Bakugo -->
        <h2 class="section-title">Katsuki Bakugo</h2>
        <div class="grid" id="gallery-katsuki"></div>

        <!-- Galerie 3: This War of Mine -->
        <h2 class="section-title">This War of Mine</h2>
        <div class="grid" id="gallery-thiswar"></div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
    <script>
        // Liste aller exakten Bildpfade aus deinen Ordnern
        const galleries = {
            frostpunk: [
                "Frostpunk Tower/IMG_20230920_044211.jpg", // Vorschaubild als erstes
                "Frostpunk Tower/IMG_20230917_141406.jpg",
                "Frostpunk Tower/IMG_20230917_141924.jpg",
                "Frostpunk Tower/IMG_20230920_042440.jpg",
                "Frostpunk Tower/IMG_20230920_043855.jpg",
                "Frostpunk Tower/IMG_20230920_044040.jpg",
                "Frostpunk Tower/IMG_20230920_044257.jpg",
                "Frostpunk Tower/IMG_20230920_044412.jpg"
            ],
            katsuki: [
                "Katsuki Bakugo/Katsuki 1 (5).jpg", // Vorschaubild als erstes
                "Katsuki Bakugo/Katsuki 1 (1).jpg",
                "Katsuki Bakugo/Katsuki 1 (2).jpg",
                "Katsuki Bakugo/Katsuki 1 (3).jpg",
                "Katsuki Bakugo/Katsuki 1 (4).jpg",
                "Katsuki Bakugo/Katsuki 1 (6).jpg",
                "Katsuki Bakugo/Katsuki 1 (7).jpg",
                "Katsuki Bakugo/Katsuki 1 (8).jpg",
                // Sicherheits-Varianten falls der Ordner auf GitHub noch anders heißt:
                "Katsuki Basugo/Katsuki 1 (5).jpg",
                "Katsuki Basugo/Katsuki 1 (1).jpg",
                "Katsuki Basugo/Katsuki 1 (2).jpg",
                "Katsuki Basugo/Katsuki 1 (3).jpg",
                "Katsuki Basugo/Katsuki 1 (4).jpg",
                "Katsuki Basugo/Katsuki 1 (6).jpg",
                "Katsuki Basugo/Katsuki 1 (7).jpg",
                "Katsuki Basugo/Katsuki 1 (8).jpg"
            ],
            thiswar: [
                "This war of mine/Zz The game.jpg", // Vorschaubild als erstes
                "This war of mine/Anton (1).jpg",
                "This war of mine/Anton (2).jpg",
                "This war of mine/Arica (1).jpg",
                "This war of mine/Arica (2).jpg",
                "This war of mine/Boris (1).jpg",
                "This war of mine/Boris (2).jpg",
                "This war of mine/Bruno (1).jpg",
                "This war of mine/Bruno (2).jpg",
                "This war of mine/Cveta (1).jpg",
                "This war of mine/Cveta (2).jpg",
                "This war of mine/Emilia (1).jpg",
                "This war of mine/Emilia (2).jpg",
                "This war of mine/Katia (1).jpg",
                "This war of mine/Katia (2).jpg",
                "This war of mine/Marin (1).jpg",
                "This war of mine/Marin (2).jpg",
                "This war of mine/Marko (1).jpg",
                "This war of mine/Marko (2).jpg",
                "This war of mine/Pavle (1).jpg",
                "This war of mine/Pavle (2).jpg",
                "This war of mine/Roman (1).jpg",
                "This war of mine/Roman (2).jpg",
                "This war of mine/Zlata (1).jpg",
                "This war of mine/Zlata (2).jpg"
            ]
        };

        function buildGallery(galleryKey, containerId) {
            const container = document.getElementById(containerId);
            const images = galleries[galleryKey];
            let firstLoaded = false;

            images.forEach((src) => {
                const img = new Image();
                img.src = src;
                img.onload = () => {
                    const a = document.createElement('a');
                    a.href = src;
                    a.dataset.fancybox = galleryKey;

                    if (!firstLoaded) {
                        // Das erste erfolgreich geladene Bild wird das sichtbare Vorschaubild
                        firstLoaded = true;
                        a.className = 'grid-item';
                        const displayImg = document.createElement('img');
                        displayImg.src = src;
                        a.appendChild(displayImg);
                    } else {
                        // Alle weiteren geladenen Bilder werden versteckt
                        a.style.display = 'none';
                    }
                    container.appendChild(a);
                };
                // Versuche auch die Endung .JPG in Großbuchstaben, falls .jpg fehlschlägt
                img.onerror = () => {
                    if (src.endsWith('.jpg')) {
                        const altSrc = src.slice(0, -4) + '.JPG';
                        const altImg = new Image();
                        altImg.src = altSrc;
                        altImg.onload = () => {
                            const a = document.createElement('a');
                            a.href = altSrc;
                            a.dataset.fancybox = galleryKey;
                            if (!firstLoaded) {
                                firstLoaded = true;
                                a.className = 'grid-item';
                                const displayImg = document.createElement('img');
                                displayImg.src = altSrc;
                                a.appendChild(displayImg);
                            } else {
                                a.style.display = 'none';
                            }
                            container.appendChild(a);
                        };
                    }
                };
            });
        }

        buildGallery('frostpunk', 'gallery-frostpunk');
        buildGallery('katsuki', 'gallery-katsuki');
        buildGallery('thiswar', 'gallery-thiswar');

        Fancybox.bind("[data-fancybox]", {});
    </script>
</body>
</html>
